          The response includes the recommended session size, the estimated memory for the session.

          This endpoint requires the `Content-Type: application/json` header to be set.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_count:
                  type: integer
                  description: The number of nodes to be stored in the instance.
                node_property_count:
                  type: integer
                  description: The number of properties per node.
                node_label_count:
                  type: integer
                  description: The number of labels per node.
                relationship_count:
                  type: integer
                  description: The number of relationships to be stored in the instance.
                relationship_property_count:
                  type: integer
                  description: The number of properties per relationship.
                algorithm_categories:
                  type: array
                  items:
                    type: string
                  description: The algorithm categories to be used in the instance.
              required:
                - node_count
                - relationship_count
            examples:
              Estimate the size of a new session:
                value:
                  node_count: 1000000
                  node_property_count: 512
                  node_label_count: 3
                  relationship_count: 5000000
                  relationship_property_count: 5
                  algorithm_categories:
                    - similarity
                    - community-detection
