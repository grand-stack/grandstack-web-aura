          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  schemas:
    Project:
      type: object
      description: Describes an Aura project.
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - name
            - instance_configurations
          properties:
            id:
              type: string
              description: The id of the project
            name:
              type: string
              description: The name of the project
            instance_configurations:
              type: array
              description: A list of instance configurations that are supported by the project
              items:
                type: object
                description: A configuration for an instance
                required:
                  - region
                  - region_name
                  - type
                  - version
                  - memory
                  - storage
                  - cloud_provider
                properties:
                  region:
                    $ref: '#/components/schemas/InstanceRegion'
                  region_name:
                    type: string
                    description: A human-friendly name for the region
                  type:
                    $ref: '#/components/schemas/InstanceType'
                  memory:
                    $ref: '#/components/schemas/InstanceMemory'
                  storage:
                    $ref: '#/components/schemas/InstanceStorage'
                  version:
                    $ref: '#/components/schemas/InstanceVersion'
                  cloud_provider:
                    $ref: '#/components/schemas/CloudProvider'
    ProjectSummary:
      type: object
      description: 'Summary of an Aura project details, as returned in the get projects endpoint.'
      properties:
        id:
          type: string
          description: The id of the project
        name:
          type: string
          description: The name of the project
      required:
        - id
        - name
    Instance:
      type: object
      description: Describes an Aura instance.
      properties:
        data:
          type: object
          required:
            - id
            - name
            - status
            - connection_url
            - cloud_provider
            - tenant_id
            - memory
            - storage
            - region
            - type
            - created_at
          properties:
            id:
              type: string
              description: The id of the instance
            name:
              type: string
              description: The name of the instance
            status:
              type: string
              description: The status of the instance
              enum:
                - creating
                - destroying
                - running
                - pausing
                - paused
                - suspending
                - suspended
                - resuming
                - loading
                - loading failed
                - restoring
                - updating
                - overwriting
            connection_url:
              type: string
              description: URL for connecting to the Neo4j instance
            created_at:
              type: string
              description: The timestamp when the instance was created
            metrics_integration_url:
              type: string
              description: Metrics integration endpoint URL for the Neo4j instance
            region:
              $ref: '#/components/schemas/InstanceRegion'
            type:
                $ref: '#/components/schemas/InstanceType'
            cloud_provider:
              $ref: '#/components/schemas/CloudProvider'
            tenant_id:
              type: string
              description: The project to which the instance belongs to
            memory:
              $ref: '#/components/schemas/InstanceMemory'
            storage:
              $ref: '#/components/schemas/InstanceStorage'
            customer_managed_key_id:
              type: string
              description: ID of the Customer Managed Key if one was used for creating the instance
            graph_nodes:
              type: string
              description: The number of nodes in an Instance. **This field is returned ONLY for free instances**
            graph_relationships:
              type: string
              description: The number of relationships in an Instance. **This field is returned ONLY for free instances**
            secondaries_count:
              type: number
              description: The number of secondaries in an Instance. **This field is returned ONLY for VDC instances**
            cdc_enrichment_mode:
              type: string
              description: The CDC mode of the instance. **This field is returned ONLY for VDC or BC instances**
              enum:
                - OFF
                - DIFF
                - FULL
            vector_optimized:
              type: boolean
              description: The vector optimization configuration of the instance.
            graph_analytics_plugin:
              type: boolean
              description: The graph analytics plugin configuration of the instance.
      required:
        - data
    CustomerManagedKey:
      type: object
      description: 'Describes a Customer Managed Key'
      properties:
        data:
          properties:
            id:
              type: string
              description: The id of the key
            name:
              type: string
              description: The name of the key
            cloud_provider:
              type: string
              description: The cloud provider of the key
              enum:
                - gcp
                - aws
                - azure
            region:
              type: string
              description: The region where this key was configured for. The key will be only be available for encrypting instances in this region.
            instance_type:
              type: string
              description: The type of instances this key was configured for. Either 'enterprise-db' or 'enterprise-ds'.
              enum:
                - enterprise-db
                - enterprise-ds
            key_id:
              type: string
              description: The ID of the key in your Cloud Provider. Equal to Key ARN for AWS.
            created:
              type: string
              description: Timestamp when the key was created
            status:
              type: string
              description: The status of the key
            tenant_id:
              type: string
              description: The project to which the key belongs to
          required:
            - id
            - name
            - cloud_provider
            - region
            - instance_type
            - key_id
            - created
            - status
            - tenant_id
      required:
        - data
    InstanceSummary:
      type: object
      description: 'Summary of an Aura instance details, as returned in the get instances endpoint.'
      properties:
        id:
          type: string
          description: The id of the instance
        name:
          type: string
          description: The name of the instance
        tenant_id:
          type: string
          description: The project to which the instance belongs to
        cloud_provider:
          type: string
          description: The cloud provider of the instance
          enum:
            - gcp
            - aws
            - azure
        created_at:
          type: string
          description: The timestamp when the instance was created
      required:
        - id
        - name
        - tenant_id
        - cloud_provider
        - created_at
    InstanceRegion:
      type: string
      description: The region where the instance is hosted. Please refer to your Aura project instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid regions for your project.
    InstanceMemory:
      type: string
      description: The size of the instance memory in GB. Please refer to your Aura project instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid sizes for your project.
    InstanceStorage:
      type: string
      description: The size of the instance storage in GB. Please refer to your Aura project instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid sizes for your project. This field is NOT returned for Aura DB Free instances.
    InstanceType:
      type: string
      enum:
        - enterprise-db
        - enterprise-ds
        - business-critical
        - professional-db
        - professional-ds
        - free-db
      description: The type of the instance. Please refer to your Aura project instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid types for your project. The `enterprise-db` type is used to represent Virtual Dedicated Cloud.
    InstanceVersion:
      type: string
      description: The Neo4j version of the instance. Please refer to your Aura project instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid versions for your project.
    CloudProvider:
      type: string
      description: The cloud provider hosting the instance. Please refer to your Aura project instance configurations, returned by the GET /tenants/{tenantId} endpoint, for a list of valid cloud_providers for your project.
      enum:
        - gcp
        - aws
        - azure
    MetricsIntegrationDetails:
      type: object
      description: 'Details about project metrics integration.'
      properties:
        data:
          type: object
          properties:
            endpoint:
              type: string
              format: uri
              description: Metrics integration endpoint URL.
          required:
            - endpoint
      required:
        - data
    GdsSessionDetails:
      type: object
      description: Describes a GDS Session
      properties:
        data:
          type: object
          required:
            - id
            - name
            - memory
            - status
            - host
            - tenant_id
            - user_id
          properties:
              cloud_provider:
                type: string
                description: The cloud provider of the session
              created_at:
                type: string
                description: The timestamp when the session was created
              expiry_date:
                type: string
                description: The timestamp when the session will expire
              host:
                type: string
                description: The host where the session is running
              id:
                type: string
                description: The unique identifier for this session
              instance_id:
                type: string
                description: The id for the instance the session is associated with. Empty if not attached to any instance.
              database_uuid:
                type: string
                description: The UUID of the Neo4j database from which the session was created from. Empty if not attached to any instance.
              memory:
                type: string
                description: The size of the session main memory in GB
              name:
                type: string
                description: The name of the session
              tenant_id:
                type: string
                description: The project to which the instance belongs to
              region:
                type: string
                description: The region where the session is hosted
              status:
                type: string
                description: The status of the session
                enum:
                  - Creating
                  - Ready
                  - Expired
                  - Failed
              ttl:
                type: integer
                description: The time to live of an inactive session before it expires.
              user_id:
                type: string
                description: The user who created the session
    Error:
      type: object
      description: Used for describing one or more errors returned by an endpoint.
      title: Error
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: 'Detailed explanation of an error that has been encountered. Aimed at developers debugging issues, not recommended to be passed onto the end user.'
              reason:
                type: string
                description: The category of the error.
              field:
                type: string
                description: 'The name of the property in the request body that this error refers to, if applicable.'
            required:
              - message
              - reason
      required:
        - errors
    MiddlewareError:
      type: object
      description: |-
        Sometimes our API middleware may return an error in this format.

        The error message is an explanation of the error that has been encountered. Aimed at developers debugging issues, not recommended to be passed onto the end user.
      properties:
        error:
          type: string
          description: Error message describing the problem
  securitySchemes:
    oauthToken:
      type: oauth2
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: 'https://api.neo4j.io/oauth/token'
      description: ''
  requestBodies: {}
  responses:
    PermanentRedirect:
      description: 'One of our endpoints have moved permanently, or you are attempting to access the API using HTTP.'
      headers:
        Location:
          schema:
            type: string
            format: uri-reference
          description: URI reference of the permanent new location for this resource
    BadRequest:
      description: 'The request body contains malformed syntax, or is otherwise invalid. Please check and adjust the request before attempting to send it again.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The request cannot be verified as belonging to an authentic client.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    Forbidden:
      description: 'The access token has expired / been revoked, or the client does not have permissions to perform the requested action.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    InstanceNotFound:
      description: The requested instance could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Instance not found:
              value:
                errors:
                  - message: 'DB not found: 24d18db5'
                    reason: db-not-found
    ProjectNotFound:
      description: The requested project could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Project not found:
              value:
                errors:
                  - message: 'The tenant you specified could not be found'
                    reason: tenant-not-found
    Conflict:
      description: 'This indicates that this action cannot be performed due to an ongoing operation, such as cloning from this instance.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Trying to pause an instance which is currently resuming:
              value:
                errors:
                  - message: 'The database is current undergoing an operation: resuming'
                    reason: ongoing-database-operation
    UnsupportedMediaType:
      description: Please specify the "Content-Type" header with a valid media type (which is "application/json" for all endpoints except for the POST /oauth/token endpoint).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    TooManyRequests:
      description: |-
        :- Rate limit exceeded or the server couldn't handle the current level of traffic.
        Please see the API Overview for a description of API Rate Limitations.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
      headers:
        Retry-After:
          required: false
          schema:
            example: '5'
          description: |-
            Suggested minimum time to wait before retrying the request if it is safe to do so.

            This is either a relative number of seconds, or a date string.
    InternalServerError:
      description: 'This indicates a bug in the API server. The problem may be transient, so consider retrying.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    BadGateway:
      description: This indicates a problem with the API server. Consider retrying.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    ServiceUnavailable:
      description: This indicates the server is currently down or overloaded. Consider retrying.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    SnapshotNotFound:
      description: 'No such snapshot:snapshot-timestamp-1 for DB Instance01'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Snapshot not found:
              value:
                errors:
                  - message: 'Snapshot not found: snapshot-timestamp-1'
                    reason: snapshot-not-found
    GatewayTimeout:
      description: 'This indicates a problem with the server, where the request processing time was unusually slow, causing a timeout error. Consider retrying.'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/MiddlewareError'
    CustomerManagedKeyNotFound:
      description: The requested customer managed key could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Instance not found:
              value:
                errors:
                  - message: 'Encryption Key not found: <UUID>'
                    reason: encryption-key-not-found
    SessionConflict:
      description: Session already exists with different parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Session already exists with different parameters:
              value:
                errors:
                  - message: "session `people` already exists for project `<ID>` with different parameters: Memory (is: 8GB, requested: 4GB)"
                    reason: ""
    SessionNotFound:
      description: Session does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Session does not exist:
              value:
                errors:
                  - message: "session with id `s-f5138f3b-7956-4` not found"
                    reason: ""
  parameters:
    instanceId:
      name: instanceId
      in: path
      schema:
        type: string
      description: Instance ID
      required: true
    instanceIdQuery:
      name: instanceId
      in: query
      schema:
        type: string
      description: Instance ID
      required: false
    customerManagedKeyId:
      name: customerManagedKeyId
      in: path
      schema:
        type: string
      description: Customer Managed Key ID
      required: true
    tenantId:
      name: tenantId
      in: path
      schema:
        type: string
      description: Project ID
      required: true
    tenantIdOptional:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
      description: An optional project ID to filter instances in a project
    tenantIdForCmkOptional:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
      description: An optional project ID to filter customer managed keys in a project
    tenantIdForSessionsOptional:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
      description: An optional project ID to filter GDS Sessions
    organizationIdOptional:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
      description: An optional organization ID to filter GDS Sessions
    sessionId:
      name: sessionId
      in: path
      schema:
        type: string
      description: GDS Session ID
      required: true
  headers:
    X-Tyk-Api-Expires:
      description: |-
        This is an optional response header, reserved for future use.

        This header will be set with a date if this version of the API is deprecated and due to expire.

        Once an API version has expired it will no longer be available.

        We will communicate API deprecation and expiry in advance and try to keep the migration path as seamless as possible.
      schema:
        type: string
        example: 'Mon, 03 Mar 2025 00:00:00 UTC'
    X-Request-Id:
      description: |-
        This response header is returned with all authenticated API requests.

        The header is set with a unique request id that tracks every Aura API request across our internal components.

        This Id would be particularly useful to quote for any troubleshooting when contacting Aura Support.
      schema:
        type: string
        example: '8a35fa95b983aeff3e70394832706f45/12383853214941892751'
  examples: {}
security:
  - oauthToken: []
