      description: |-
        Starts the process of overwriting the specified instance with data from the source instance provided.

        The overwrite process mimics the 'Clone to existing' functionality of the Aura Console.

        If only a `source_instance_id` is provided, a new snapshot of that instance is created and used for overwriting. Alternatively, you can specify an additional `source_snapshot_id` to use a specific snapshot of the source instance for overwriting.

        Overwriting an instance is an asynchronous operation. You can poll the current status of this operation by periodically getting the instance details for the instance ID using the GET /instances/{instanceId} endpoint.

        The time it takes to overwrite depends on the amount of data stored in the instance; larger quantities of data will take longer. The exact time this will take is dependent on the size of your data store.

        If you are trying to overwrite an instance that is already being cloned then, a 409 Conflict HTTP response code will be returned as the operation cannot be performed.

        If you are trying to overwrite a free instance, a 420 Unsupported Action response code will be returned as the operation cannot be performed.

        If you are trying to overwrite an instance smaller than the source data instance, a 500 DB Overwrite Size Disparity response code with a message of `Cannot clone database <ID_1> into smaller database <ID_2>.` will be returned as the operation cannot be performed.
        This is dependant on the allocated instance size, not the size of the actual data.

        As overwrite is an asynchronous operation, the endpoint returns a 202 Accepted HTTP response code.

        This endpoint requires the `Content-Type: application/json` header to be set.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
