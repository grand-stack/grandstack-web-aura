                  cloud_provider: gcp
                  customer_managed_key_id: UUID_OF_YOUR_KEY
  /instances/sizing:
    post:
      summary: Estimate the size of a new instance
      tags:
        - instances
      operationId: post-instances-sizing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recommended_size:
                        type: string
                        description: The recommended instance size.
                      min_required_memory:
                        type: string
                        description: The minimum required memory for the instance.
                      did_exceed_maximum:
                        type: boolean
                        description: Indicates if the instance size exceeds the maximum allowed.
                    required:
                      - did_exceed_maximum
                      - min_required_memory
                      - recommended_size
              examples:
                Sizing details:
                  value:
                    data:
                      did_exceed_maximum: false
                      min_required_memory: 14GB
                      recommended_size: 16GB
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: |-
          This endpoint estimates the size of a new instance based on the provided configuration.
          Supported instance types are `enterprise-ds`, and `professional-ds`, depending on your project configuration.

          The recommended size can can be used to create an instance using POST `/instances`.

          The response includes the recommended instance size, the minimum required memory for the instance, and a boolean value indicating if the instance size exceeds the maximum allowed by your Aura project instance configuration.

          This endpoint requires the `Content-Type: application/json` header to be set.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_count:
                  type: integer
                  description: The number of nodes to be stored in the instance.
                relationship_count:
                  type: integer
                  description: The number of relationships to be stored in the instance.
                instance_type:
                  $ref: '#/components/schemas/InstanceType'
                algorithm_categories:
                  type: array
                  items:
                    type: string
                  description: The algorithm categories to be used in the instance.
              required:
                - node_count
                - relationship_count
            examples:
              Estimate the size of a new professional-ds instance:
                value:
                  node_count: 1000000
                  relationship_count: 5000000
                  instance_type: "professional-ds"
                  algorithm_categories:
                    - pathfinding
                    - community-detection
              Estimate the size of a new enterprise-ds instance:
                value:
                  node_count: 1000000
                  relationship_count: 5000000
                  instance_type: "enterprise-ds"
                  algorithm_categories:
                    - node-embedding
  '/instances/{instanceId}':
    parameters:
      - $ref: '#/components/parameters/instanceId'
    get:
      summary: Returns instance details
      tags:
        - instances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
              examples:
                Instance details:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: running
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      connection_url: YOUR_CONNECTION_URL
                      metrics_integration_url: YOUR_METRICS_INTEGRATION_ENDPOINT
                      region: europe-west1
                      type: enterprise-db
                      memory: 8GB
                      storage: 16GB
                      created_at: '2023-01-20T13:44:42Z'
                      vector_optimized: false
                Instance details with CMK:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: running
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      connection_url: YOUR_CONNECTION_URL
                      region: europe-west1
                      type: enterprise-db
                      memory: 8GB
                      storage: 16GB
                      created_at: '2023-01-20T13:44:42Z'
                      customer_managed_key_id: UUID_OF_YOUR_KEY
                Instance details with Secondary enabled:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: running
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      connection_url: YOUR_CONNECTION_URL
                      region: europe-west1
                      type: enterprise-db
                      memory: 8GB
                      storage: 16GB
                      created_at: '2023-01-20T13:44:42Z'
                      secondaries_count: 0

                Instance details with CDC Enrichment Mode enabled:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: running
                      tenant_id: YOUR_TENANT_ID
                      cloud_provider: gcp
                      connection_url: YOUR_CONNECTION_URL
