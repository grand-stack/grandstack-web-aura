                    The name may include any UTF-8 characters with no trailing or leading whitespace.
                  example: Instance01
                  maxLength: 30
                  minLength: 1
                memory:
                  $ref: '#/components/schemas/InstanceMemory'
                vector_optimized:
                  type: boolean
                  description: Add or remove the instance vector optimization.
                graph_analytics_plugin:
                  type: boolean
                  description: Add or remove the instance graph analytics plugin.
