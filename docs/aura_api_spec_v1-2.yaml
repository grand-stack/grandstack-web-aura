                      storage: 16GB
                      created_at: '2023-01-20T13:44:42Z'
                      cdc_enrichment_mode: FULL
                Instance details configured with vector optimization and the Graph Analytics plugin:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: running
                      tenant_id: YOUR_TENANT_ID
                      cloud_provider: gcp
                      connection_url: YOUR_CONNECTION_URL
                      region: europe-west1
                      type: professional-db
                      memory: 8GB
                      storage: 16GB
                      created_at: '2023-01-20T13:44:42Z'
                      vector_optimized: true
                      graph_analytics_plugin: true
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          links:
            PauseInstance:
              operationId: pause-instance-id
              parameters:
                instanceId: $response.body#/data/id
            ResumeInstance:
              operationId: resume-instance-id
              parameters:
                instanceId: $response.body#/data/id
            DestroyInstance:
              operationId: delete-instance-id
              parameters:
                instanceId: $response.body#/data/id
        '308':
          $ref: '#/components/responses/PermanentRedirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InstanceNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      operationId: get-instance-id
      description: |-
        This endpoint returns details about a specific Aura Instance.

        Note for Virtual Dedicated Cloud customers: In the example schema below, the `enterprise-db` type is used to represent Virtual Dedicated Cloud.
    delete:
      summary: Deletes an instance
      tags:
        - instances
      operationId: delete-instance-id
      responses:
        '202':
          description: Instance is being deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
              examples:
                Instance details:
                  value:
                    data:
                      id: 2f49c2b3
                      name: Production
                      status: destroying
                      connection_url: YOUR_CONNECTION_URL
                      tenant_id: YOUR_PROJECT_ID
                      cloud_provider: gcp
                      memory: 8GB
                      storage: 16GB
                      region: europe-west1
                      type: enterprise-db
                      created_at: '2023-01-20T13:44:42Z'
                      vector_optimized: false
          headers:
            X-Tyk-Api-Expires:
              $ref: '#/components/headers/X-Tyk-Api-Expires'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '308':
          $ref: '#/components/responses/PermanentRedirect'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InstanceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      description: |-
        Starts the deletion process of an Aura instance.

        Deleting an instance is an asynchronous operation. You can poll the current status of this operation by periodically getting the instance details for the instance ID using the GET /instances/{instanceId} endpoint.

        If another operation is being performed on the instance you are trying to delete, a 409 Conflict HTTP response code will be returned that indicates that deletion cannot be performed. As deletion is an asynchronous operation, the endpoint returns a 202 Accepted HTTP response code.

        As DELETE is an idempotent HTTP method it is safe to retry or send duplicate requests. However, the server will only reply at most once with a successful deletion response (202 Accepted) and will respond with error status codes for any other requests (most likely with 404 Not Found). We suggest treating either 202 or 404 as signs of completion when retrying requests to this endpoint.

        Warning: There is no way to recover data from a deleted Aura instance.

        Note for Virtual Dedicated Cloud customers: In the example schema below, the `enterprise-db` type is used to represent Virtual Dedicated Cloud.
    patch:
