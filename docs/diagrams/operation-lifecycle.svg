<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">The life of a change: plan, confirm, run</title><desc id="d">An operation starts PLANNED and can be cancelled. Confirming moves it to CONFIRMED in one query. Running sends the request to Aura once and watches until Aura shows the change. It ends SUCCEEDED or FAILED. Operations interrupted by a restart are picked up again.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="498.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="40" font-size="14" font-weight="700" text-anchor="start" fill="#0f2233">An operation only moves forward, and Aura is only asked after a confirm</text>
<rect x="40" y="170" width="160" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="120.0" y="192" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">PLANNED</text>
<text x="120.0" y="212" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">diff and before stored</text>
<text x="120.0" y="228" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">nothing sent to Aura</text>
<rect x="290" y="170" width="160" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="370.0" y="192" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">CONFIRMED</text>
<text x="370.0" y="212" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">six steps created</text>
<text x="370.0" y="228" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">not yet sent</text>
<rect x="540" y="170" width="160" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="620.0" y="192" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">RUNNING</text>
<text x="620.0" y="212" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">request sent once,</text>
<text x="620.0" y="228" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">watching Aura</text>
<rect x="800" y="100" width="160" height="80" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="880.0" y="122" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">SUCCEEDED</text>
<text x="880.0" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">stored copy updated</text>
<rect x="800" y="250" width="160" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="880.0" y="272" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">FAILED</text>
<text x="880.0" y="292" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">reason in plain words</text>
<rect x="40" y="320" width="160" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="120.0" y="342" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">CANCELLED</text>
<text x="120.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">before confirming only</text>
<path d="M 200 210 L 290 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="245" y="203" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">confirm</text>
<path d="M 450 210 L 540 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="495" y="203" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">send</text>
<path d="M 700 190 L 750 190 L 750 140 L 800 140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 700 230 L 750 230 L 750 290 L 800 290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 370 250 L 370 410 L 880 410 L 880 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="640" y="404" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">refused before sending (for example Aura busy)</text>
<path d="M 120 250 L 120 320" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="150" y="290" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">cancel</text>
<rect x="40" y="430" width="430" height="54" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="255.0" y="452" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">After a restart</text>
<text x="255.0" y="472" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">CONFIRMED and RUNNING operations are picked up again</text>
<circle cx="40" cy="170" r="11" fill="#0a6190"/>
<text x="40" y="174.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="290" cy="170" r="11" fill="#0a6190"/>
<text x="290" y="174.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="540" cy="170" r="11" fill="#0a6190"/>
<text x="540" y="174.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="800" cy="100" r="11" fill="#0a6190"/>
<text x="800" y="104.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="800" cy="250" r="11" fill="#0a6190"/>
<text x="800" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="40" cy="430" r="11" fill="#0a6190"/>
<text x="40" y="434.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
</svg>
