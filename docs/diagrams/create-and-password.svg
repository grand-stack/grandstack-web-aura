<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">Where an instance password goes, and how it comes back</title><desc id="d">When Aura creates an instance it returns the password once. The aura subgraph seals it and stores it first, then records the instance, then watches until it is running. Later, clicking the eye calls revealInstancePassword, which opens the sealed value, records the reveal, and returns the password once for the page to show for thirty seconds.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="558.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="40" font-size="14" font-weight="700" text-anchor="start" fill="#0f2233">Aura shows the password once: store it first, record every showing</text>
<rect x="20" y="56" width="560" height="480" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="32" y="74" font-size="11" font-weight="650" text-anchor="start" fill="#64748b">When the instance is created</text>
<rect x="600" y="56" width="380" height="480" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="612" y="74" font-size="11" font-weight="650" text-anchor="start" fill="#64748b">When someone shows it</text>
<rect x="40" y="90" width="250" height="80" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="165.0" y="112" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Aura answers the create</text>
<text x="165.0" y="132" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">id, connection URL, username,</text>
<text x="165.0" y="148" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">and the PASSWORD, once</text>
<rect x="40" y="210" width="250" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="165.0" y="232" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Seal and store the password</text>
<text x="165.0" y="252" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">AES-256-GCM, owner = instance id</text>
<text x="165.0" y="268" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">InstanceCredential node, over Bolt</text>
<rect x="40" y="330" width="250" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="165.0" y="352" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Record the instance</text>
<text x="165.0" y="372" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">Instance and its links in the store,</text>
<text x="165.0" y="388" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">operation target, credential link</text>
<rect x="40" y="450" width="250" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="165.0" y="472" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Watch until running</text>
<text x="165.0" y="492" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">then refresh the stored copy</text>
<path d="M 165 170 L 165 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 165 290 L 165 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 165 410 L 165 450" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="320" y="210" width="240" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="440.0" y="232" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">If it cannot be stored</text>
<text x="440.0" y="252" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">the change fails and says so:</text>
<text x="440.0" y="268" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">Aura will not show it again</text>
<path d="M 290 250 L 320 250" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="630" y="90" width="320" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="790.0" y="112" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">The eye is clicked</text>
<text x="790.0" y="132" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">on the instance page</text>
<text x="790.0" y="148" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">(never on load)</text>
<rect x="630" y="210" width="320" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="790.0" y="232" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">revealInstancePassword</text>
<text x="790.0" y="252" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">open the sealed value;</text>
<text x="790.0" y="268" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">wrong key or wrong owner fails</text>
<rect x="630" y="330" width="320" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="790.0" y="352" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Record it, then return it</text>
<text x="790.0" y="372" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">revealCount, lastRevealedAt,</text>
<text x="790.0" y="388" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">AuditEvent (who, when)</text>
<rect x="630" y="450" width="320" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="790.0" y="472" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">The page shows it for 30 seconds</text>
<text x="790.0" y="492" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">then hides; never in storage or the URL</text>
<path d="M 790 170 L 790 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 790 290 L 790 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 790 410 L 790 450" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<circle cx="40" cy="90" r="11" fill="#0a6190"/>
<text x="40" y="94.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="40" cy="210" r="11" fill="#0a6190"/>
<text x="40" y="214.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="40" cy="330" r="11" fill="#0a6190"/>
<text x="40" y="334.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="320" cy="210" r="11" fill="#0a6190"/>
<text x="320" y="214.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="630" cy="330" r="11" fill="#0a6190"/>
<text x="630" y="334.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="630" cy="450" r="11" fill="#0a6190"/>
<text x="630" y="454.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
</svg>
