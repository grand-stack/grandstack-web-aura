<text x="820" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="520" cy="420" r="11" fill="#0a6190"/>
<text x="520" y="424.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<circle cx="30" cy="250" r="11" fill="#0a6190"/>
<text x="30" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
