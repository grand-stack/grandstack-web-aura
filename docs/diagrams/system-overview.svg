<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">How the parts of grandstack-web-aura fit together</title><desc id="d">A browser reaches the web server, optionally through an edge that adds TLS and a sign-in. The web server serves the app and forwards /graphql to the gateway, which composes a read-only store subgraph and an aura subgraph. The store reads and writes Neo4j. Only the aura subgraph talks to the Aura REST API and holds the key that seals secrets.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="558.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="40" font-size="14" font-weight="700" text-anchor="start" fill="#0f2233">Everything the browser asks goes through one gateway</text>
<rect x="30" y="100" width="170" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="115.0" y="122" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Browser or phone</text>
<text x="115.0" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">the React app</text>
<rect x="250" y="100" width="190" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6" stroke-dasharray="6 4"/>
<text x="345.0" y="122" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Edge (optional)</text>
<text x="345.0" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">TLS, sign-in, rate limits</text>
<rect x="490" y="100" width="210" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="595.0" y="122" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Web server (nginx)</text>
<text x="595.0" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">serves the app,</text>
<text x="595.0" y="158" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">forwards /graphql</text>
<rect x="750" y="100" width="220" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="860.0" y="122" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Gateway (Hive)</text>
<text x="860.0" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">one supergraph</text>
<path d="M 200 135 L 250 135" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="225" y="128" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">https</text>
<path d="M 440 135 L 490 135" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 700 135 L 750 135" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="725" y="128" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">/graphql</text>
<path d="M 115 100 L 115 80 L 595 80 L 595 100" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="355" y="74" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">plain http, the default</text>
<rect x="560" y="250" width="190" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="655.0" y="272" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Store subgraph</text>
<text x="655.0" y="292" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">read-only</text>
<text x="655.0" y="308" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">the cached Aura state</text>
<rect x="820" y="250" width="160" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="900.0" y="272" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Aura subgraph</text>
<text x="900.0" y="292" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">plan, confirm,</text>
<text x="900.0" y="308" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">reveal, check</text>
<path d="M 800 170 L 800 210 L 655 210 L 655 250" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 910 170 L 910 250" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 820 290 L 750 290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="785" y="282" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">internal :4002 + token</text>
<rect x="520" y="420" width="250" height="90" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="645.0" y="442" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Neo4j</text>
<text x="645.0" y="462" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">instances, options, operations</text>
<text x="645.0" y="478" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">sealed secrets (not in GraphQL)</text>
<rect x="800" y="420" width="180" height="90" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="890.0" y="442" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Aura REST API</text>
<text x="890.0" y="462" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">real, or mock-aura</text>
<text x="890.0" y="478" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">token from client id + secret</text>
<path d="M 655 330 L 655 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="628" y="380" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Cypher</text>
<path d="M 840 330 L 840 372 L 730 372 L 730 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="786" y="366" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Bolt: secrets</text>
<path d="M 910 330 L 910 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="935" y="380" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">REST</text>
<rect x="30" y="250" width="440" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="250.0" y="272" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">What is published</text>
<text x="250.0" y="292" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">default: the web server on 127.0.0.1:3100, plain HTTP</text>
<text x="250.0" y="308" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">with compose.edge.yaml: the edge only, on 8443</text>
<text x="250.0" y="324" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">never: the gateway, subgraphs, Neo4j, mock-aura</text>
<text x="250.0" y="340" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">(compose.dev.yaml publishes them on loopback, for tests)</text>
<circle cx="250" cy="100" r="11" fill="#0a6190"/>
<text x="250" y="104.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
