<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">The two ways to run the app</title><desc id="d">By default the browser talks plain HTTP to the web server on the same machine, which forwards /graphql to the gateway. With compose.aura-edge.yaml the web server and gateway are no longer published and the edge is the only way in, over TLS with a sign-in, rate limits and security headers.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="538.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="40" font-size="14" font-weight="700" text-anchor="start" fill="#0f2233">Plain on this machine, or behind the edge for anything else</text>
<rect x="20" y="56" width="960" height="190" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="32" y="74" font-size="11" font-weight="650" text-anchor="start" fill="#64748b">Default: compose.yaml + compose.aura.yaml</text>
<rect x="40" y="90" width="170" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="125.0" y="112" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Browser</text>
<text x="125.0" y="132" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">on this machine</text>
<rect x="330" y="90" width="230" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="445.0" y="112" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Web server</text>
<text x="445.0" y="132" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">published on 127.0.0.1:3000</text>
<rect x="710" y="90" width="230" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="825.0" y="112" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Gateway</text>
<text x="825.0" y="132" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">published on 127.0.0.1:4000</text>
<path d="M 210 125 L 330 125" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="270" y="118" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">http</text>
<path d="M 560 125 L 710 125" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="635" y="118" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">/graphql</text>
<rect x="330" y="180" width="450" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="555.0" y="202" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">No sign-in, no TLS</text>
<text x="555.0" y="222" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">for one person on their own machine</text>
<rect x="20" y="276" width="960" height="240" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 5"/>
<text x="32" y="294" font-size="11" font-weight="650" text-anchor="start" fill="#64748b">With the edge: + compose.aura-edge.yaml</text>
<rect x="40" y="320" width="170" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="125.0" y="342" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Phone or laptop</text>
<text x="125.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">on the network</text>
<rect x="280" y="320" width="230" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="395.0" y="342" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Edge (nginx)</text>
<text x="395.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">TLS 1.2+, Basic sign-in</text>
<text x="395.0" y="378" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">20 req/s; POST 60/min</text>
<rect x="600" y="320" width="160" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="680.0" y="342" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Web server</text>
<text x="680.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">not published</text>
<rect x="800" y="320" width="160" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="880.0" y="342" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Gateway</text>
<text x="880.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">not published</text>
<path d="M 210 360 L 280 360" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="245" y="353" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">https :8443</text>
<path d="M 510 355 L 600 355" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="555" y="348" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">/</text>
<path d="M 395 320 L 395 304 L 880 304 L 880 320" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="640" y="298" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">/graphql (never cached)</text>
<rect x="280" y="430" width="480" height="66" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="520.0" y="452" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">What the edge adds</text>
<text x="520.0" y="472" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">strict content security policy, no framing, no sniffing,</text>
<text x="520.0" y="488" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">credentials never forwarded, 64 kB limit on /graphql</text>
<circle cx="330" cy="90" r="11" fill="#0a6190"/>
<text x="330" y="94.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="330" cy="180" r="11" fill="#0a6190"/>
<text x="330" y="184.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="280" cy="320" r="11" fill="#0a6190"/>
<text x="280" y="324.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="600" cy="320" r="11" fill="#0a6190"/>
<text x="600" y="324.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="280" cy="430" r="11" fill="#0a6190"/>
<text x="280" y="434.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
</svg>
