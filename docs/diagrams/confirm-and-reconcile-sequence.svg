<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">From a plan to a finished change</title><desc id="d">The web app asks the aura subgraph to plan, which reads the store and records a PLANNED operation. After the person confirms, the aura subgraph checks the instance has not changed, moves the operation to CONFIRMED in one query, sends the request to Aura once, polls until the instance shows the change, updates the stored copy and marks the operation SUCCEEDED. The web app reads the operation every 1.5 seconds.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="638.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="20" y="56" width="140" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="90.0" y="78" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Web app</text>
<path d="M 90 96 L 90 610" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="290" y="56" width="140" height="40" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="360.0" y="78" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Aura subgraph</text>
<path d="M 360 96 L 360 610" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="560" y="56" width="140" height="40" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="630.0" y="78" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Store</text>
<path d="M 630 96 L 630 610" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="810" y="56" width="140" height="40" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="880.0" y="78" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">Aura API</text>
<path d="M 880 96 L 880 610" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="36" y="40" font-size="14" font-weight="700" text-anchor="start" fill="#0f2233">Plan, review, confirm, run</text>
<path d="M 90 135 L 360 135" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="225.0" y="128" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">planUpdate(instanceId, changes)</text>
<path d="M 360 170 L 630 170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="495.0" y="163" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">read the instance and offered sizes</text>
<path d="M 360 205 L 630 205" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="495.0" y="198" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">create Operation: PLANNED, diff, before</text>
<path d="M 360 240 L 90 240" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="225.0" y="233" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">operationId</text>
<text x="110" y="280" font-size="11" font-weight="400" text-anchor="start" fill="#0f2233">review screen: the diff and warnings</text>
<path d="M 90 310 L 360 310" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="225.0" y="303" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">confirmOperation(id, typedName?)</text>
<path d="M 360 345 L 630 345" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
