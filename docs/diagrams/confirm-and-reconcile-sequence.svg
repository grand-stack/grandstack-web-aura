<path d="M 360 420 L 880 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="620.0" y="413" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">send once: PATCH, POST or DELETE</text>
<path d="M 880 455 L 360 455" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="620.0" y="448" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">202 accepted</text>
<path d="M 360 490 L 880 490" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="620.0" y="483" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">poll GET until stable and matching</text>
<path d="M 360 525 L 630 525" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="495.0" y="518" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">refresh the instance, steps DONE, SUCCEEDED</text>
<path d="M 90 575 L 630 575" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="360.0" y="568" font-size="11" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">through the gateway: operation and steps every 1.5 s</text>
