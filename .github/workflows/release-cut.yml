name: release-cut
# The release button: choose the kind of release; this sets the version, tags it, and runs the release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Kind of release
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      dry-run:
        description: Show the next version and what would change, push nothing
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
  actions: read
jobs:
  cut:
    uses: grand-stack/.github/.github/workflows/cut-release.yml@v1
    with:
      bump: ${{ inputs.bump }}
      dry-run: ${{ inputs.dry-run }}
  release:
    needs: cut
    if: ${{ !inputs.dry-run }}
    uses: grand-stack/.github/.github/workflows/release.yml@v1
    with:
      tag: ${{ needs.cut.outputs.tag }}
      images: '[{"name":"grandstack-web-aura-subgraph","context":".","file":"aura/Dockerfile"},{"name":"grandstack-web-aura-mock","context":".","file":"mock-aura/Dockerfile"},{"name":"grandstack-web-aura-web","context":".","file":"web/Dockerfile"},{"name":"grandstack-web-aura-edge","context":"edge","file":"edge/Dockerfile"}]'
      skip-ci-gate: true
    secrets: inherit
