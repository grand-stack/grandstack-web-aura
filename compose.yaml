# Neo4j, the store and aura subgraphs, a fake Aura API, the gateway and the web app. Pointed at mock-aura by default: no real Aura
# account is touched.
# The app is published as plain HTTP on 127.0.0.1:3100, with no sign-in: fine on your own machine, not on a network. To put TLS and a
# sign-in in front of it, add compose.edge.yaml. To also publish the other services on loopback, add compose.dev.yaml.
#
# First time:
#   scripts/init-env.sh                                       # .env: the key that seals secrets, the database password, a token
#   docker compose -p gwa up -d --build                       # the app is then at http://localhost:3100
# With the edge (TLS and sign-in, the way to serve other devices):
#   scripts/init-env.sh --edge                                # also a certificate and the sign-in (prints the password once)
#   docker compose -p gwa -f compose.yaml -f compose.edge.yaml up -d --build    # https://localhost:8443
# After a schema change, compose the supergraph with the dev file (see README.md) and rebuild the gateway.
services:
  neo4j:
    image: neo4j:2026.10.0-community@sha256:388c0e5c6d4543e3d0e6cee3d1e751c05ad9314aa73342cc63cd0ea0946e38bb
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run scripts/init-env.sh first}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  store:
    build:
      context: .
      dockerfile: store/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run scripts/init-env.sh first}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run scripts/init-env.sh first}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/graphql?query=%7B__typename%7D').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy

  aura:
    build:
      context: .
      dockerfile: aura/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run scripts/init-env.sh first}
      STORE_INTERNAL_URL: http://store:4002/graphql
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Run scripts/init-env.sh first}
      SECRET_KEY: "${SECRET_KEY:?Run scripts/init-env.sh first}"
      # The fake Aura by default. For a real account set AURA_BASE_URL=https://api.neo4j.io (ALLOW_INSECURE_AURA_URL then has no effect).
      AURA_BASE_URL: ${AURA_BASE_URL:-http://mock-aura:4020}
      ALLOW_INSECURE_AURA_URL: ${ALLOW_INSECURE_AURA_URL:-true}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-900000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/graphql?query=%7B__typename%7D').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      store:
        condition: service_healthy
      mock-aura:
        condition: service_started

  mock-aura:
    build:
      context: .
      dockerfile: mock-aura/Dockerfile
    environment:
      MOCK_STEP_MS: ${MOCK_STEP_MS:-3000}

  gateway:
    build:
      context: gateway
    environment:
      # The app calls the gateway through its own origin (the web server or the edge forwards /graphql), so this only matters for a
      # browser page served from somewhere else. Set PUBLIC_ORIGIN to the address you open the app at.
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3100}
    depends_on:
      store:
        condition: service_healthy
      aura:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Empty: the app calls /graphql on its own origin, which the web server (or the edge in front of it) forwards to the gateway
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-}
    ports:
      # Plain HTTP and no sign-in, on this machine only. To reach it from another device set WEB_BIND=0.0.0.0, which puts the app and
      # everything it can do (including deleting instances) in front of anyone on the network. Prefer the edge: compose.edge.yaml.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3100}:8080"
    depends_on:
      - gateway

volumes:
  neo4j-data:
