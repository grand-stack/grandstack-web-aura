# Foundations stack: Neo4j, the store subgraph and a fake Aura API. No real Aura account is touched.
# Ports are offset from grandstack's compose file (7474/7687, 4000) so both stacks can run at once.
services:
  neo4j:
    image: neo4j:2026.10.0-community@sha256:388c0e5c6d4543e3d0e6cee3d1e751c05ad9314aa73342cc63cd0ea0946e38bb
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-gwa-dev-password}
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-gwa-dev-password} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  store:
    build:
      context: .
      dockerfile: store/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-gwa-dev-password}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-gwa-dev-internal-token}
    ports:
      # Only the public, read-only subgraph is published. The internal endpoint (4002) stays on the compose network.
      - "4001:4001"
    depends_on:
      neo4j:
        condition: service_healthy

  mock-aura:
    build:
      context: .
      dockerfile: mock-aura/Dockerfile
    environment:
      MOCK_STEP_MS: ${MOCK_STEP_MS:-3000}
    ports:
      - "4020:4020"

volumes:
  neo4j-data:
