# Neo4j, the store and aura subgraphs, a fake Aura API and the gateway. Pointed at mock-aura by default: no real Aura account is touched.
# Ports are offset from grandstack's compose file (7474/7687, 4000) so both stacks can run at once.
# There is no sign-in yet (PLAN.md Phase 5), so every published port is bound to 127.0.0.1 and nothing is reachable from the network.
#
# First time:
#   echo "SECRET_KEY=$(openssl rand -base64 32)" >> .env     # seals the Aura client secret. Keep it: a new key cannot open old secrets
#   docker compose -p gwa up -d --build neo4j store aura mock-aura
#   npm run compose:supergraph                                # composes gateway/supergraph.graphql from the running subgraphs
#   docker compose -p gwa up -d --build gateway
services:
  neo4j:
    image: neo4j:2026.10.0-community@sha256:388c0e5c6d4543e3d0e6cee3d1e751c05ad9314aa73342cc63cd0ea0946e38bb
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-gwa-dev-password}
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-gwa-dev-password} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  store:
    build:
      context: .
      dockerfile: store/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-gwa-dev-password}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-gwa-dev-internal-token}
    ports:
      # Only the public, read-only subgraph is published, for composing the supergraph. The internal endpoint (4002) stays on the compose network.
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/graphql?query=%7B__typename%7D').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy

  aura:
    build:
      context: .
      dockerfile: aura/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-gwa-dev-password}
      STORE_INTERNAL_URL: http://store:4002/graphql
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-gwa-dev-internal-token}
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY first, as described at the top of compose.yaml}"
      # The fake Aura by default. For a real account set AURA_BASE_URL=https://api.neo4j.io (ALLOW_INSECURE_AURA_URL then has no effect).
      AURA_BASE_URL: ${AURA_BASE_URL:-http://mock-aura:4020}
      ALLOW_INSECURE_AURA_URL: ${ALLOW_INSECURE_AURA_URL:-true}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-900000}
    ports:
      # For composing the supergraph. The subgraph has no sign-in of its own, so it is loopback only.
      - "127.0.0.1:4010:4010"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/graphql?query=%7B__typename%7D').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      store:
        condition: service_healthy
      mock-aura:
        condition: service_started

  mock-aura:
    build:
      context: .
      dockerfile: mock-aura/Dockerfile
    environment:
      MOCK_STEP_MS: ${MOCK_STEP_MS:-3000}
    ports:
      - "127.0.0.1:4020:4020"

  gateway:
    build:
      context: gateway
    environment:
      CORS_ORIGIN: http://localhost:3000
    ports:
      # 4100, not 4000: grandstack's own gateway and server use 4000
      - "127.0.0.1:4100:4000"
    depends_on:
      store:
        condition: service_healthy
      aura:
        condition: service_healthy

volumes:
  neo4j-data:
