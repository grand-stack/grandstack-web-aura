# For developing and for the tests: publishes the services that compose.yaml keeps on the compose network, on loopback only.
# None of these has a sign-in. Do not use this file on a machine other people can reach, and not in a deployment.
#   docker compose -p gwa -f compose.yaml -f compose.dev.yaml up -d --build
# Ports are offset from grandstack's own stack (7474/7687, 4000) so both can run at once.
services:
  neo4j:
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
  store:
    ports:
      # The public, read-only subgraph, for composing the supergraph. The internal endpoint (4002) is never published.
      - "127.0.0.1:4001:4001"
  aura:
    ports:
      - "127.0.0.1:4010:4010"
  mock-aura:
    ports:
      # The tests change the fake Aura directly to arrange a drift or a refusal
      - "127.0.0.1:4020:4020"
  gateway:
    ports:
      # 4100, not 4000: grandstack's own gateway and server use 4000. For codegen and `npm run dev`.
      - "127.0.0.1:4100:4000"
  edge:
    environment:
      # The browser run makes many changes in a minute. Real use never needs this.
      EDGE_MUTATION_RATE: ${EDGE_MUTATION_RATE:-1200r/m}
      EDGE_REQUEST_RATE: ${EDGE_REQUEST_RATE:-200r/s}
